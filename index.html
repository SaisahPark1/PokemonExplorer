<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @font-face {
            font-family: 'Orbitron';
            src: url('./fonts/Orbitron/Orbitron-VariableFont_wght.ttf');
            /* font-color: #e2441c; */
        } @theme {
            --default-font-family: "Orbitron", sans-serif;
        }
    </style>
    <title>Pokedex Explorer</title>
</head>
<body class="bg-violet-200">
    <header class="flex items-center gap-4 bg-violet-400 h-20 border-b-4 border-violet-700 shadow-sm shadow-zinc-400">
        <h1 class="PC-Box p-4">PC Box #?????</h1>
        <!-- Main Container -->
<div class="relative inline-block text-left">
  
  <!-- Main Trigger Button -->
  <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none">
    Filter
  </button>

  <!-- First Level Dropdown (Appears on Hover/Click depending on your JS, shown here as open by default or controlled) -->
  <div class="absolute left-0 mt-2 w-48 bg-white border border-gray-200 rounded-md shadow-lg z-10">
    <div class="py-1">

      <!-- Nested Dropdown Trigger Container (Must have "group" and "relative") -->
      <div class="group relative">
        <button class="w-full text-left flex justify-between items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
          <span>By Type</span>
          <!-- Right Arrow Icon -->
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <!-- Second Level Dropdown (Flies out to the right) -->
        <div class="absolute left-full top-0 hidden group-hover:block w-48 bg-white border border-gray-200 rounded-md shadow-lg z-20">
          <div class="py-1">
            <a href="#" id="normal" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Normal</a>
            <a href="#" id="fire" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Fire</a>
            <a href="#" id="water" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Water</a>
            <a href="#" id="grass" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Grass</a>
            <a href="#" id="electric" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Electric</a>
            <a href="#" id="ice" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Ice</a>
            <a href="#" id="fighting" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Fighting</a>
            <a href="#" id="poison" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Poison</a>
            <a href="#" id="ground" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Ground</a>
            <a href="#" id="flying" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Flying</a>
            <a href="#" id="psychic" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Psychic</a>
            <a href="#" id="bug" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Bug</a>
            <a href="#" id="rock" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Rock</a>
            <a href="#" id="ghost" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Ghost</a>
            <a href="#" id="dragon" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Dragon</a>
            <a href="#" id="dark" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Dark</a>
            <a href="#" id="steel" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Steel</a>
            <a href="#" id="fairy" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Fairy</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
        <!-- <div class="relative inline-block group">
            <button class="px-4 py-2 bg-rose-600 border-4 border-white text-white rounded-md">Options</button>
        <div class="hidden group-hover:block absolute w-48 bg-white border border-gray-200 rounded-md shadow-lg">
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Themes</a>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Filter</a>
        </div>
    </div> -->
    <search>
        <form action="search">
            <input type="search" name="query" id="search-input" placeholder="Lucario" class="bg-amber-400 border-violet-700 border-4 rounded-xl p-2">
            <button type="submit" id="search-button">Search</button>
        </form>
    </search>
    </header>
     <div id="loader" class="flex justify-center">
        <img src="./images/black_screen.jpg" alt="black" class="fixed top-0 left-0 w-screen h-screen object-cover z-10 pointer-events-none">
        <img src="./images/pokeball.png" alt="Loading" class="flex fixed min-[480px]:h-fit min-[768px]:h-screen z-10 animate-spin">
    </div>
    <div id="infoContainer" class="grid justify-self-center min-[480px]:grid-cols-1 min-[728px]:grid-cols-2 gap-4 border-slate-900 border-4 bg-amber-200 p-4 mt-2 mb-2 h-92 sm:overflow-scroll sm:overflow-x-hidden shadow-xl shadow-zinc-400">
        <div class="grid min-[728px]:grid-cols-1">
        <h3 class="">Name: <span id="info-name">#</span></h3>
        <h3 class="">Number: <span id="number">#</span></h3>
        <h3 class="">Primary Type: <span id="p-type">#</span></h3>
        <h3 class="">Secondary Type: <span id="s-type">#</span></h3>
        <h3 class="">Height: <span id="height">#</span></h3>
        <h3 class="">Weight: <span id="weight">#</span></h3>
        <h3 class="">Base Experience: <span id="exp">#</span></h3>
        </div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="placeholder" id="close-up" class="justify-self-center h-full">
        <!--<div class="flex grid-cols-subgrid col-span-2">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="placeholder" id="close-up" class=" border-4 border-slate-500 object-contain h-25 w-25">
        </div> -->
    </div>
    <!-- Ref img <img src="https://archives.bulbagarden.net/media/upload/thumb/3/37/Bill_PC_HGSS.png/220px-Bill_PC_HGSS.png" alt="" id="image" class=""> -->
    <article id="pokemonHolder" class="grid overflow-y-scroll max-h-82 bg-mauve-200 border-4 border-black-700 grid-cols-2 md:grid-cols-3 lg:grid-cols-6 p-12 gap-12"><button class="rounded-[50%]"><div id="card" class="flex flex-col items-center">
            <span id="name" class="align-self-center">Loremmon!</span>
                <div class="flex justify-center items-center p-8 max-w-3xs max-h-96 m-4 border-4 hover:border-blue-500 border-slate-900 bg-gradient-to-b from-rose-600 from-50% to-indigo-50 to-50% rounded-[50%] shadow-xl shadow-zinc-400">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Imagine bulbasaur here" id="image" class="h-full">
            </button></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
