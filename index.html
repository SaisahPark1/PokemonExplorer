<!DOCTYPE html>

<head>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">

            font-family: 'Orbitron';
            src: url('./fonts/Orbitron/Orbitron-VariableFont_wght.ttf');

<body class="bg-violet-200">

        </span>

                <div class="flex justify-center items-center p-8 max-w-3xs max-h-96 m-4 border-4 hover:border-blue-500 border-slate-900 bg-gradient-to-b from-rose-600 from-50% to-indigo-50 to-50% rounded-[50%]">
