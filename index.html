<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @font-face {
            font-family: 'Orbitron';
            src: url('./fonts/Orbitron/Orbitron-VariableFont_wght.ttf');
            /* font-color: #e2441c; */
        } @theme {
            --default-font-family: "Orbitron", sans-serif;
        }
    </style>
    <title>Pokedex Explorer</title>
</head>
<body class="bg-violet-200">
    <header class="flex items-center gap-4 bg-violet-400 h-20 border-b-4 border-violet-700 shadow-sm shadow-zinc-400">
        <h1 class="PC-Box p-4">PC Box #?????</h1>
        <div class="flex items-center">
        <label for="types" class="">Filter by Type:</label>
            <select name="" id="" class="visible">
                <option value="none">None</option>
                <option value="normal">Normal</option>
                <option value="fighting">Fighting</option>
                <option value="flying">Flying</option>
                <option value="poison">Poison</option>
                <option value="ground">Ground</option>
                <option value="rock">Rock</option>
                <option value="bug">Bug</option>
                <option value="ghost">Ghost</option>
                <option value="steel">Steel</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="grass">Grass</option>
                <option value="electric">Electric</option>
                <option value="psychic">Psychic</option>
                <option value="ice">Ice</option>
                <option value="dragon">Dragon</option>
                <option value="dark">Dark</option>
                <option value="fairy">Fairy</option>
            </select>

        <!-- <div class="relative inline-block group">
            <button class="px-4 py-2 bg-rose-600 border-4 border-white text-white rounded-md">Options</button>
        <div class="hidden group-hover:block absolute w-48 bg-white border border-gray-200 rounded-md shadow-lg">
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Themes</a>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Filter</a>
        </div>
    </div> -->
    <search>
        <form action="search">
            <input type="search" name="query" id="search-input" placeholder="Lucario" class="bg-amber-200 border-violet-700 border-4 rounded-xl p-2">
            <button type="submit" id="search-button" class="">Search</button>
        </form>
    </search>
    </header>
     <div id="loader" class="flex justify-center">
        <img src="./images/black_screen.jpg" alt="black" class="fixed top-0 left-0 w-screen h-screen object-cover z-10 pointer-events-none">
        <img src="./images/pokeball.png" alt="Loading" class="flex fixed min-[480px]:h-fit min-[768px]:h-screen z-10 animate-spin">
    </div>
    <div id="infoContainer" class="grid justify-self-center min-[480px]:grid-cols-1 min-[728px]:grid-cols-2 gap-4 border-slate-900 border-4 bg-amber-200 p-4 mt-2 mb-2 h-92 sm:overflow-scroll sm:overflow-x-hidden shadow-xl shadow-zinc-400">
        <div class="grid min-[728px]:grid-cols-1">
        <h3 class="">Name: <span id="info-name">#</span></h3>
        <h3 class="">Number: <span id="number">#</span></h3>
        <h3 class="">Primary Type: <span id="p-type">#</span></h3>
        <h3 class="">Secondary Type: <span id="s-type">#</span></h3>
        <h3 class="">Height: <span id="height">#</span></h3>
        <h3 class="">Weight: <span id="weight">#</span></h3>
        <h3 class="">Base Experience: <span id="exp">#</span></h3>
        </div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="placeholder" id="close-up" class="justify-self-center h-full">
    </div>
    <!-- Ref img <img src="https://archives.bulbagarden.net/media/upload/thumb/3/37/Bill_PC_HGSS.png/220px-Bill_PC_HGSS.png" alt="" id="image" class=""> -->
     <form id="pokeNum" action="search" class="flex justify-self-center"><span class="bg-mauve-200 border-b-0 border-black border-4 border-r-0 p-4">How many pokemon?</span><input id="numberOf" type="number" placeholder="151" class="border-4 border-black bg-mauve-200 border-b-0 p-2"></form>
    <article id="pokemonHolder" class="grid overflow-y-scroll max-h-82 bg-mauve-200 border-4 border-black-700 grid-cols-2 md:grid-cols-3 lg:grid-cols-6 p-12 gap-12">
        <button class="rounded-[50%]"><div id="card" class="flex flex-col items-center">
            <span id="name" class="align-self-center">Loremmon!</span>
                <div class="flex justify-center items-center p-8 max-w-3xs max-h-96 m-4 border-4 hover:border-blue-500 border-slate-900 bg-gradient-to-b from-rose-600 from-50% to-indigo-50 to-50% rounded-[50%] shadow-xl shadow-zinc-400">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Imagine bulbasaur here" id="image" class="h-full">
            </button></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
